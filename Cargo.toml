[package]
name = "music-native-names"
version = "1.0.3"
edition = "2021"
description = "A native macOS menu bar helper for original-language Apple Music names"
license = "MIT"
repository = "https://github.com/LogicSense1/music-native-names"
readme = "README.md"
publish = false

[features]
default = []
ui-test = []

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = "0.4"
futures = "0.3"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
